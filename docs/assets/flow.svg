<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">whatseal two-phase send</title>
  <desc id="desc">Agent prepares a draft. A native macOS dialog shows the immutable preview. Touch ID or the login password is required before WhatsApp Web sends.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="8" y="28" width="200" height="140" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="28" y="70" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">1. Agent reads</text>
  <text x="28" y="96" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">unread digest · search</text>
  <text x="28" y="116" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">list / read chats</text>
  <text x="28" y="144" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">no Touch ID</text>

  <path d="M218 98 H268" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#head)"/>

  <rect x="276" y="28" width="200" height="140" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="296" y="70" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">2. Prepare</text>
  <text x="296" y="96" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">single-use draft</text>
  <text x="296" y="116" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">10-minute TTL</text>
  <text x="296" y="144" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">no secret returned</text>

  <path d="M486 98 H536" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#head)"/>

  <rect x="544" y="28" width="200" height="140" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="564" cy="64" r="7" fill="#0d9488"/>
  <text x="578" y="70" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">3. You approve</text>
  <text x="564" y="96" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">native macOS dialog</text>
  <text x="564" y="116" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">exact immutable preview</text>
  <text x="564" y="144" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Touch ID / password</text>

  <path d="M754 98 H804" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#head)"/>

  <rect x="812" y="28" width="100" height="140" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="832" y="88" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Send</text>
  <text x="828" y="114" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">WhatsApp</text>
  <text x="836" y="132" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Web</text>
</svg>
